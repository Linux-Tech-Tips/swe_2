spring:
  application:
    name: tutorial-time
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate.ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://oauth2.unixusergroup.org/application/o/tutorial-time/
