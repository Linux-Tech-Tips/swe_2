name: tt

services:
  reverse-proxy:
    image: nginx:latest
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    expose:
      - "80"
    depends_on:
      - backend-wrapper
      - frontend
      - jenkins
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  frontend:
    image: martin/frontend
    hostname: frontend
    restart: unless-stopped
    expose:
      - "5173"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  backend-wrapper:
    image: martin/backend-wrapper
    hostname: backend-wrapper
    restart: unless-stopped
    privileged: true
    mem_limit: "1024m"
    environment:
      - DOCKER_TLS_CERTDIR=
    expose:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  jenkins:
    image: jenkins/jenkins:lts
    hostname: jenkins
    restart: unless-stopped
    mem_limit: "1024m"
    expose:
      - "8080"
    volumes:
      - ./jenkins_data:/var/jenkins_home
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  docs:
    image: martin/docs
    restart: unless-stopped
    expose:
      - "8081"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    env_file:
      - ".env"
    environment:
      - "TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    depends_on:
      - reverse-proxy
