name: tt

include:
  - backend-db-include.yaml
services:
  jenkins:
    image: jenkins/jenkins:lts
    hostname: jenkins
    restart: unless-stopped
    mem_limit: "1024m"
    expose:
      - "8080"
    volumes:
      - ./jenkins_data:/var/jenkins_home
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  docs:
    image: martin/docs:latest
    build: ./docs
    hostname: docs
    restart: unless-stopped
    mem_limit: "128m"
    expose:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  frontend:
    image: martin/frontend:latest
    build: ./frontend
    hostname: frontend
    restart: unless-stopped
    mem_limit: "128m"
    expose:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  backend:
    image: martin/backend:latest
    build: ./backend
    hostname: backend
    restart: unless-stopped
    mem_limit: "512m"
    networks:
      default:
      db_internal:
    expose:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    mem_limit: "128m"
    env_file:
      - ".env"
    environment:
      - "TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    depends_on:
      - docs
      - jenkins
      - frontend
      - backend

networks:
  default:
  db_internal:
