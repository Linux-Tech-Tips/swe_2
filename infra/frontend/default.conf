server {
  server_name docs.unixusergroup.org;
  listen 8080;
  root /web/app;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src https:" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
